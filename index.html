<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wedding of Rafi & Cyndi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f7f5f0;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      border: 1px solid #e8e4dc;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8c827a;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      color: #2b2b2b;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .divider {
      width: 40px;
      height: 2px;
      background-color: #d4af37;
      margin: 0 auto 24px;
    }

    .guest-box {
      background-color: #fbf9f5;
      border: 1px dashed #dcd6cd;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 28px;
    }

    .guest-box p {
      font-size: 12px;
      color: #777;
      margin-bottom: 6px;
    }

    .guest-name {
      font-size: 16px;
      font-weight: 600;
      color: #2b2b2b;
    }

    .event-card {
      margin-bottom: 24px;
      padding: 16px;
      background: #fafafa;
      border-radius: 8px;
    }

    .event-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
    }

    .event-time {
      font-size: 13px;
      color: #666;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background-color: #2b2b2b;
      color: #fff;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      background-color: #444;
    }

    footer {
      margin-top: 30px;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <p class="subtitle">The Wedding Celebration of</p>
    <h1>Romeo &amp; Juliet</h1>
    <div class="divider"></div>

    <div class="guest-box">
      <p>Kepada Yth. Bapak/Ibu/Saudara/i:</p>
      <div class="guest-name" id="guest-name">Tamu Undangan</div>
    </div>

    <div class="event-card">
      <div class="event-title">Akad Nikah</div>
      <div class="event-time">Sabtu, 20 Desember 2026<br>08.00 - 10.00 WIB</div>
    </div>

    <div class="event-card">
      <div class="event-title">Resepsi</div>
      <div class="event-time">Sabtu, 20 Desember 2026<br>11.00 - 14.00 WIB</div>
    </div>

    <a href="https://maps.google.com" target="_blank" class="btn">📍 Buka Google Maps</a>

    <footer>
      Kami yang berbahagia,<br>Keluarga Besar Kedua Mempelai
    </footer>
  </div>

  <script>
    // Ambil nama dari parameter URL ?to=Nama+Tamu
    const urlParams = new URLSearchParams(window.location.search);
    const guest = urlParams.get('to');
    if (guest) {
      document.getElementById('guest-name').innerText = guest;
    }
  </script>
</body>
</html>
